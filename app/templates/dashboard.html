<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>HealthTech PHI/PII Pipeline</title>

    <link rel="stylesheet"
          href="{{ url_for('static', path='adminlte/css/adminlte.min.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', path='plugins/fontawesome-free/css/all.min.css') }}">
</head>

<body class="hold-transition sidebar-mini">

<div class="wrapper">

    <nav class="main-header navbar navbar-expand navbar-white navbar-light">
        <span class="navbar-brand">
            HealthTech PHI/PII Redaction
        </span>
    </nav>

    <aside class="main-sidebar sidebar-dark-primary elevation-4">

        <a href="/dashboard" class="brand-link">
            <span class="brand-text font-weight-light">
                HealthTech Security
            </span>
        </a>

        <div class="sidebar">

            <nav class="mt-2">

                <ul class="nav nav-pills nav-sidebar flex-column">

                    <li class="nav-item">
                        <a href="/dashboard" class="nav-link active">
                            <i class="nav-icon fas fa-tachometer-alt"></i>
                            <p>Dashboard</p>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="/docs" class="nav-link">
                            <i class="nav-icon fas fa-code"></i>
                            <p>API Docs</p>
                        </a>
                    </li>

                </ul>

            </nav>

        </div>

    </aside>

    <div class="content-wrapper">

        <section class="content-header">
            <div class="container-fluid">
                <h1>PHI/PII Redaction Dashboard</h1>
            </div>
        </section>

        <section class="content">

            <div class="container-fluid">

                <div class="row">

                    <div class="col-lg-4 col-6">
                        <div class="small-box bg-info">
                            <div class="inner">
                                <h3>Redaction</h3>
                                <p>PHI/PII Detection</p>
                            </div>

                            <div class="icon">
                                <i class="fas fa-shield-alt"></i>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-4 col-6">
                        <div class="small-box bg-success">
                            <div class="inner">
                                <h3>Secure</h3>
                                <p>Token Vault</p>
                            </div>

                            <div class="icon">
                                <i class="fas fa-lock"></i>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-4 col-6">
                        <div class="small-box bg-warning">
                            <div class="inner">
                                <h3>Restore</h3>
                                <p>Token Restoration</p>
                            </div>

                            <div class="icon">
                                <i class="fas fa-undo"></i>
                            </div>
                        </div>
                    </div>

                </div>

                <div class="card">

                    <div class="card-header">
                        <h3 class="card-title">
                            System Status
                        </h3>
                    </div>

                    <div class="card-body">

                        <p>
                            <strong>Pipeline:</strong>
                            Clinical Text → Detection → Token Vault → Redacted Output
                        </p>

                        <p>
                            <strong>Status:</strong>
                            <span class="badge badge-success">
                                Operational
                            </span>
                        </p>

                    </div>

                </div>

            </div>

        </section>

    </div>

</div>

<script src="{{ url_for('static', path='plugins/jquery/jquery.min.js') }}"></script>

<script src="{{ url_for('static', path='plugins/bootstrap/js/bootstrap.bundle.min.js') }}"></script>

<script src="{{ url_for('static', path='adminlte/js/adminlte.min.js') }}"></script>

</body>
</html>
